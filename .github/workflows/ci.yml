name: CI
on:
  push:
    branches: [main, 'feature/**', 'chore/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/validate-source.mjs
      - run: npm test
      - name: Install FFmpeg for sample encoding
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install CC0 recorded piano
        run: node scripts/install-piano.mjs
      - run: npm run build
      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: loopbench-html
          path: dist/loopbench.html
          if-no-files-found: error
          retention-days: 30
