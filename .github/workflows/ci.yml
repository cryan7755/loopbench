name: CI
on:
  push:
    branches: [main, 'feature/**', 'chore/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/validate-source.mjs
      - run: npm test
      - run: npm run build
      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: loopbench-html
          path: dist/loopbench.html
          if-no-files-found: error
          retention-days: 30
